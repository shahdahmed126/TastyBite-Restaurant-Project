{% extends 'restaurant/base.html' %}

{% block title %}Delete Dish - TastyBite Admin{% endblock %}

{% block content %}
<div class="py-5">
    <div class="max-w-2xl mx-auto">
        <div class="glass-panel p-4 p-md-5 text-center">
            <i class="fa-solid fa-triangle-exclamation fa-4x text-danger mb-3"></i>
            <h2 class="fw-bold text-white mb-2">Delete "{{ item.name }}"?</h2>
            <p class="text-muted mb-4">This action cannot be undone. The dish will be permanently removed from the menu.</p>

            <div class="d-flex justify-content-center gap-3">
                <form method="POST" action="{% url 'delete_item' item.pk %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4 py-3 rounded-4 fw-bold">
                        <i class="fa-solid fa-trash me-2"></i>Yes, Delete It
                    </button>
                </form>
                <a href="{% url 'manage_items' %}" class="btn btn-glass px-4 py-3 rounded-4 fw-bold">Cancel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
